on:
  schedule:
    # Daily at 03:17 UTC - an arbitrary off-peak minute, not a round hour.
    - cron: "17 3 * * *"
  workflow_dispatch:

name: fuzz

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzDecode
            dir: .
          - target: FuzzParseSchema
            dir: .
          - target: FuzzOCFDecode
            dir: ./ocf
    env:
      GO_VERSION: "1.26"
      FUZZ_TIME: 10m

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Fuzz ${{ matrix.target }}
        working-directory: ${{ matrix.dir }}
        run: go test -run=${{ matrix.target }} -fuzz=${{ matrix.target }} -fuzztime=${{ env.FUZZ_TIME }} .

      - name: Upload crasher
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crasher-${{ matrix.target }}
          path: |
            **/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
